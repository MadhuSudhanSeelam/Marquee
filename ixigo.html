<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ixigo Style Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fa;
    /* padding:20px; */
}

.container{
    display:grid;
    gap:15px;

    grid-template-areas:
    "header header header"
    "hero hero hero"
    "feature1 feature2 feature3"
    "about about about"
    "card1 card2 card3"
    "portfolio portfolio portfolio"
    "testimonial testimonial testimonial"
    "contact contact contact"
    "footer footer footer";
}

.box{
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
.box1{
    /* border-radius:15px; */
    border-bottom: curve;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* Header */
.header{
    grid-area:header;
    background:blue;
    color:white;
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-weight:bold;
}

/* Hero */
.hero{
    grid-area:hero;
    background:linear-gradient(185deg,#522e2f,#0051ff);
    color:white;
    text-align:center;
    height:250px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.hero button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff5a5f;
    font-weight:bold;
    cursor:pointer;
}

/* Features */
.feature1,.feature2,.feature3{
    height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
}

.feature1{
    grid-area:feature1;
    background:#ffd166;
}

.feature2{
    grid-area:feature2;
    background:#ff8c42;
    color:white;
}

.feature3{
    grid-area:feature3;
    background:#22c55e;
    color:white;
}

/* About */
.about{
    grid-area:about;
    background:white;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    color:#333;
    border:2px solid black;
}

/* Cards */
.card1,.card2,.card3{
    height:180px;
    background:white;
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
}

.card1{grid-area:card1;}
.card2{grid-area:card2;}
.card3{grid-area:card3;}

/* Portfolio */
.portfolio{
    grid-area:portfolio;
    background:#fff3e0;
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
}

/* Testimonials */
.testimonial{
    grid-area:testimonial;
    background:#ffe0b2;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
}

/* Contact */
.contact{
    grid-area:contact;
    background:#fff7ed;
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
}

/* Footer */
.footer{
    grid-area:footer;
    background:#1f2937;
    color:white;
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}
</style>
</head>
<body>

<div class="container">

    <div class="box1 header">
        <div class="logo">ixigo</div>
        <div class="menu">
            <a href="#">Flights</a>
            <a href="#">Trains</a>
            <a href="#">Hotels</a>
            <a href="#">Buses</a>
        </div>
    </div>

    <div class="box hero">
        <h1>Travel Smarter</h1>
        <p>Book Flights, Trains, Hotels & Buses</p>
        <button>Explore Now</button>
    </div>

    <div class="box feature1">✈ Flights</div>
    <div class="box feature2">🚆 Trains</div>
    <div class="box feature3">🏨 Hotels</div>

    <div class="box about">
        About Us Section
    </div>

    <div class="box card1">Best Deals</div>
    <div class="box card2">Offers</div>
    <div class="box card3">Rewards</div>

    <div class="box portfolio">
        Popular Destinations
    </div>

    <div class="box testimonial">
        Customer Reviews
    </div>

    <div class="box contact">
        Contact Us
    </div>

    <div class="box footer">
        © 2026 Travel Website
    </div>

</div>

</body>
</html>
