<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    .nav1,.nav2,.nav3{
        height:30px;
        width:550px;
        background-color:white;
        border-radius:3px;
        margin:3px;
    }

    .one,.two,.three{
        height:105px;
        width:175px;
        background-color:rgb(199, 175, 243);
        border:2px solid black;
        border-radius:20px;
        margin:3px;
        display:inline-block;
    }

    .main{
        height:200px;
        width:550px;
        background-color:rgb(255, 252, 65);
        border:2px solid black;
        border-radius:3px;
        margin:3px;

        display:flex;
        justify-content:space-evenly;
        align-items:center;
    }

    .flip{
        height:20px;
        width:70px;
        background-color:rgb(238, 255, 0);
        border:2px solid black;
        border-radius:10px;
        margin:3px;
        display:inline-block;
    }

    .travel{
        height:20px;
        width:70px;
        background-color:rgb(233, 219, 219);
        border:2px solid black;
        border-radius:10px;
        margin:3px;
        display:inline-block;
    }

    .loc{
        height:20px;
        width:150px;
        background-color:white;
        border:2px solid black;
        border-radius:10px;
        margin:3px;
        margin-left:220px;
        display:inline-block;
    }

    .search{
        height:20px;
        width:350px;
        background-color:white;
        border:2px solid rgb(43, 137, 230);
        border-radius:3px;
        margin:3px;
        display:inline-block;
    }

    .login{
        height:20px;
        width:50px;
        background-color:white;
        border:2px solid black;
        border-radius:3px;
        margin:3px;
        display:inline-block;
    }

    .shape{
        height:20px;
        width:25px;
        background-color:rgb(98, 229, 214);
        border:2px solid black;
        border-radius:3px;
        margin:5px;
        display:inline-block;
    }

    .one1{
        height:160px;
        width:120px;
        background-color:rgb(202, 236, 236);
        border:2px solid black;
        border-radius:3px;
    }
</style>
</head>

<body>

    <div class="nav1">
        <div class="flip"></div>
        <div class="travel"></div>
        <div class="loc"></div>
    </div>

    <div class="nav2">
        <div class="search"></div>
        <div class="login"></div>
        <div class="login"></div>
        <div class="login"></div>
    </div>

    <hr>

    <div class="nav3">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="one"></div>
    <div class="two"></div>
    <div class="three"></div>

    <div class="main">
        <div class="one1"></div>
        <div class="one1"></div>
        <div class="one1"></div>
        <div class="one1"></div>
    </div>

</body>
</html>
